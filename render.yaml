services:
  - type: web
    name: mentorbridge
    env: node
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && npm install"
    startCommand: "cd backend && node server.js"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false # Set this in the Render dashboard
      - key: DATA_DIR
        value: /opt/render/project/src/backend/data
    disk:
      name: mentorbridge-db
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
